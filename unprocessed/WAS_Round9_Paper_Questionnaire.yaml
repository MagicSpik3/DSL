questions:
  - variable: "Benefits74"
    question: "Saving Attitudes and Behaviour89"
  - variable: "Retirement89"
    question: "Attitudes to saving for retirement89"
  - variable: "ISAs131"
    question: "National Savings & Investments134"
  - variable: "Insurances142"
    question: "Currency & Cash145"
  - variable: "Cryptocurrency147"
    question: "Other financial assets148"
  - variable: "Loans172"
    question: "Household Bills179"
  - variable: "Bankruptcy180"
    question: "Other income (exc. Earnings and Benefits)181"
  - variable: "Inheritance197"
    question: "Inheritances received197"
  - variable: "Trusts209"
    question: "Questions for settlers (who have put their own assets into a trust)209"
  - variable: "Health215"
    question: "Status of parents217"
  - variable: "Ten1"
    routing:
      - "Ask all"
      - "[display HRP Name]"
      - "[Text fill (var.)][Text fill (var.)]"
      - "[Text fill (var.)]"
      - "[Text fill (var.)]"
      - "[Last time this accommodation was… (If RTen1<> empty)]"
    question: "How do you own or rent [first line of address]?"
    text_fills:
      - "display HRP Name"
      - "Text fill (var.)"
      - "Text fill (var.)"
      - "Text fill (var.)"
      - "Text fill (var.)"
      - "Last time this accommodation was… (If RTen1<> empty)"
    interviewer_instructions:
      - "INTERVIEWER INSTRUCTIONSINTERVIEWER INSTRUCTIONS"
      - "MAKE SURE ANSWER APPLIES TO HRP"
      - "RUNNING PROMPT"
      - "Interviewer Process"
      - "PROMPT AS NECESSARY"
      - "RUNNING PROMPT"
      - "INDIVIDUAL PROMPT"
      - "ASK OR RECORD"
      - "If answer already known, the question need not be asked again"
      - "CHECK"
      - "Additional instruction"
      - "Running prompt: Code all that apply"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Own it outright,"
      - code: 2
        text: "Currently pay off a mortgage or loan used to buy the property,"
      - code: 3
        text: "Own it through shared ownership (also known as ‘part-own, part-rent’),"
      - code: 4
        text: "Rent it,"
      - code: 5
        text: "Live here rent-free,"
      - code: 6
        text: "Or squatting?"
  - variable: "StartDat"
    routing:
      - "All"
    question: "ENTER DATE INTERVIEW WITH THIS HOUSEHOLD WAS STARTED"
  - variable: "DateChk"
    routing:
      - "All"
    question: "IS THIS:"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "THE FIRST TIME YOU’VE OPENED THIS QUESTIONNAIRE"
      - code: 2
        text: "OR THE SECOND OR LATER TIME?"
      - code: 5
        text: "EMERGENCY CODE IF COMPUTER’S DATE IS WRONG AT LATER CHECK"
  - variable: "IntrType"
    routing:
      - "All"
    question: "ENTER WHETHER A TELEPHONE OR FACE TO FACE INTERVIEW"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Telephone"
      - code: 2
        text: "Face to face"
  - variable: "CurStat"
    routing:
      - "Known members of household are displayed"
      - "[Last time, this person indicated…. (If RCurStat <> empty)]"
    question: "RName or (KITE)Name"
    text_fills:
      - "Last time, this person indicated…. (If RCurStat <> empty)"
  - variable: "MovedWth"
    question: "Did this person move to the same new address/household as another person already coded?"
    interviewer_instructions:
      - "If CurStat = 3,4,5 - respondent moved"
  - variable: "CountRes"
    question: "ENTER COUNTRY WHERE NOW RESIDENT"
    interviewer_instructions:
      - "If CurStat = 8 - respondent now resident abroad"
  - variable: "KnowDet"
    question: "Which details are known of where this person has moved?"
    interviewer_instructions:
      - "If CurStat = 3,4 - a member of the household has moved within GB and details are known"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Address known"
      - code: 2
        text: "Telephone number known"
      - code: 3
        text: "E-mail address known"
  - variable: "Add1"
    question: "What is the first line of the new address, please include the house number or name, and the name of the street or road?"
    interviewer_instructions:
      - "If KnowDet = 1- address of mover known"
  - variable: "Add2"
    question: "What is the second line of the new address?"
    interviewer_instructions:
      - "If KnowDet = 1- address of mover known"
  - variable: "Add3"
    question: "If Add2 = Response - entered a second line of address"
  - variable: "Add4"
    question: "If Add3 = Response - entered a third line of address"
    interviewer_instructions:
      - "If KnowDet = 1 - address of mover known"
  - variable: "PstTwn"
    question: "And in which town is the new address?"
    interviewer_instructions:
      - "If KnowDet = 1 - address of mover known"
  - variable: "PostCd"
    question: "If you know it, what is the postcode for this new address?"
    interviewer_instructions:
      - "If KnowDet = 1 - address of mover known"
  - variable: "SurePstC"
    question: "CODE FOR CERTAINTY OF CORRECT POSTCODE"
    interviewer_instructions:
      - "If KnowDet = 1 - address of mover known"
  - variable: "TeleNumb"
    question: "PLEASE ENTER TELEPHONE NUMBER, INCLUDING STD CODE"
    interviewer_instructions:
      - "If KnowDet = 2 - telephone number of mover known"
  - variable: "EmailAdd"
    question: "PLEASE ENTER EMAIL ADDRESS"
    interviewer_instructions:
      - "If KnowDet = 3 - email address of mover known"
  - variable: "HldStat"
    routing:
      - "[This household 1]"
      - "[New household 2]"
      - "Ask all"
    question: "Derived:"
    text_fills:
      - "This household 1"
      - "New household 2"
    interviewer_instructions:
      - "If Curstat = 2, HldStat = 1"
      - "If Curstat = 3,4,5; HldStat = 2"
      - "If Curstat = 6,7,8,9; HldStat = 3"
      - "IF NO INTERVIEW, PLEASE PROCEED TO ADMIN BLOCK AND CODE OUT"
      - "IF THE RESPONDENT WITHHELD ANY HOUSEHOLD MEMBER NAME, PLEASE USE A UNIQUE IDENTIFIER INSTEAD"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Same address as before"
      - code: 2
        text: "Mover"
      - code: 3
        text: "Ineligible"
  - variable: "SurNme"
    question: "Ask if RSurNme OR (KITE) RSurname = empty - i.e. if new cohort"
  - variable: "CorrNam"
    question: "IS THIS NAME CORRECT?"
    interviewer_instructions:
      - "If RName OR (KITE) Name are not blank OR if RName OR (KITE) Name = empty AND RBirth OR Rsex <> empty"
  - variable: "UpdatNam"
    question: "Can I have the correct full name please?"
    interviewer_instructions:
      - "If CorrNam = 2 - respondent’s name is incorrect"
      - "ASK OR RECORD"
  - variable: "MoreNme"
    routing:
      - "Ask all"
      - "All"
      - "[Last time sex was recorded as [Male <1> /Female <2>] (If RSex <> empty)]"
    question: "Is there anyone else who classes this residence as their main residence?"
    text_fills:
      - "Last time sex was recorded as [Male <1> /Female <2>"
    interviewer_instructions:
      - "CHECK"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes"
      - code: 2
        text: "No"
      - code: 1
        text: "Male"
      - code: 2
        text: "Female"
  - variable: "DteofBth"
    routing:
      - "Ask all"
      - "[Last time, date of birth was recorded as… (If RDteofBth <> empty)]"
    question: "What is your date of birth?"
    text_fills:
      - "Last time, date of birth was recorded as… (If RDteofBth <> empty)"
  - variable: "June15"
    question: "Is the 15th of June the actual date or an estimate?"
    interviewer_instructions:
      - "If DteofBth = 15.06"
      - "CHECK"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Actual Date"
      - code: 2
        text: "Estimate"
  - variable: "AgeIf"
    routing:
      - "[Last time, age was recorded as… (If RDVage <> empty)]"
    question: "What was your age last birthday?"
    text_fills:
      - "Last time, age was recorded as… (If RDVage <> empty)"
    interviewer_instructions:
      - "If DteofBth = DK/RF (does not know OR refuse date of birth)"
    response_type: "pre-coded"
    pre_codes:
      - code: 0
        text: ".97"
  - variable: "DVage"
    question: "Derived"
  - variable: "xMarSta"
    routing:
      - "[Last time Marital Status was recorded as… (If RxMarSta <> empty)]"
    question: "What is your legal marital status?"
    text_fills:
      - "Last time Marital Status was recorded as… (If RxMarSta <> empty)"
    interviewer_instructions:
      - "If DVAge>=16 (respondent is aged 16 or over)"
      - "PROMPT AS NECESSARY"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Never married and never legally registered in a civil partnership"
      - code: 2
        text: "Married"
      - code: 3
        text: "In a legally registered civil partnership"
      - code: 4
        text: "Divorced"
      - code: 5
        text: "Widowed"
      - code: 6
        text: "Separated but still legally married"
      - code: 7
        text: "Separated, but still legally in a civil partnership"
      - code: 8
        text: "Formerly in a civil partnership which is now legally dissolved"
      - code: 9
        text: "A surviving member of a legally registered civil partnership"
  - variable: "MarChk"
    routing:
      - "[Last time recorded as… (If RMarChk <> empty – text fill to be introduced after R9)]"
    question: "Is your husband /wife / civil partner a member of the household?"
    text_fills:
      - "Last time recorded as… (If RMarChk <> empty – text fill to be introduced after R9)"
    interviewer_instructions:
      - "If XMARSTA = 2,6 (respondent is married and living with husband/wife or in a legally recognised Civil Partnership)"
      - "ASK OR RECORD"
  - variable: "LivWth12"
    question: "May I just check, are you living with someone in this household as a couple?"
    interviewer_instructions:
      - "If DVAge >= 16 AND MarSta <> 2,6 (more than 1 person in household and respondent is aged 16 or over and not married and living with husband/wife or in a legally recognised Civil Partnership)"
      - "ASK OR RECORD"
      - "If more than one adult in household"
      - "ASK OR RECORD"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes"
      - code: 2
        text: "No"
      - code: 1
        text: "This person alone"
      - code: 3
        text: "This person jointly"
      - code: 5
        text: "Not owner/renter"
  - variable: "FtEd"
    question: "Are you presently in full-time education?"
    interviewer_instructions:
      - "If DVAge>3 AND <19 - aged over 3 and under 19 years"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes"
  - variable: "FtEd19"
    question: "Are you presently in full-time education?"
    interviewer_instructions:
      - "If DVAge = 19 - respondent is 19 years old"
  - variable: "QualChk"
    question: "Which of the following best describes the qualification that you are currently working towards? Is it ..."
    interviewer_instructions:
      - "If FtEd = 1 - in full time education"
      - "RUNNING PROMPT"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Up to A level or equivalent,"
      - code: 2
        text: "or degree level/equivalent or above?"
  - variable: "HiHNum"
    question: "You have told me that the following people jointly own or rent the accommodation. Who has the highest income from earnings, benefits, pensions and any other sources?"
    interviewer_instructions:
      - "If there are joint householders"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: ".17"
  - variable: "JntEldA"
    question: "ENTER PERSON NUMBER OF THE ELDEST JOINT HOUSEHOLDER FROM THOSE WITH THE SAME HIGHEST INCOME:"
    interviewer_instructions:
      - "If HiHNum = 17 - two or more joint householders have the same income"
      - "ASK OR RECORD"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: ".16"
  - variable: "JntEldB"
    question: "ENTER PERSON NUMBER OF THE ELDEST JOINT HOUSEHOLDER"
    interviewer_instructions:
      - "If HiHNum = DK/RF - joint householders do not know or refuse to say who has the greatest income"
      - "ASK OR RECORD"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: ".16"
  - variable: "DVHRPNum"
    routing:
      - "Ask all"
    question: "Derived"
    interviewer_instructions:
      - "PROMPT AS NECESSARY"
    response_type: "pre-coded"
    pre_codes:
      - code: 0
        text: ".16"
      - code: 1
        text: "Husband or wife (Spouse)"
      - code: 2
        text: "Legally registered Civil Partner"
      - code: 3
        text: "Partner (Cohabitee)"
      - code: 4
        text: "Son or daughter"
      - code: 5
        text: "Stepson or stepdaughter"
      - code: 6
        text: "Foster child"
      - code: 7
        text: "Son-in-law or daughter-in-law"
      - code: 8
        text: "Parent or guardian"
      - code: 9
        text: "Stepfather or stepmother"
      - code: 10
        text: "Foster parent"
      - code: 11
        text: "Father-in-law or mother-in-law"
      - code: 12
        text: "Brother or sister"
      - code: 13
        text: "Step-brother or step-sister"
      - code: 14
        text: "Foster brother or sister"
      - code: 15
        text: "Brother-in-law or sister-in-law"
      - code: 16
        text: "Grandson or granddaughter"
      - code: 17
        text: "Grandfather or grandmother"
      - code: 18
        text: "Other relative"
      - code: 19
        text: "Other non-relative"
      - code: 99
        text: "(OFFICE USE ONLY)"
  - variable: "Relate4"
    question: "End of RELATIONSHIP GRID loop"
  - variable: "HCoBa"
    question: "In which country were you born?"
    interviewer_instructions:
      - "If RHCob is EMPTY (New households and any who have not been asked before)"
      - "IF RESPONDENT SAYS BRITAIN, PROBE FOR COUNTRY"
      - "PROMPT AS NECESSARY"
    response_type: "pre-coded"
    pre_codes:
      - code: 4
        text: ".999"
  - variable: "HCoBb"
    question: "What is the other country?"
    interviewer_instructions:
      - "If HCoBa = 997 (respondent was born in another country not listed above)"
      - "IF NOT KNOWN PROMPT FOR THE AREA (E.G., EAST AFRICA, SOUTH AMERICA, ASIA, ETC.)"
  - variable: "HCoBc"
    question: "PRESS <SPACE BAR> TO ENTER THE CODING FRAME"
    interviewer_instructions:
      - "If HCoBa = 997 AND HCoBb <> empty"
  - variable: "HCoB"
    question: "Derived variable"
    interviewer_instructions:
      - "If RHCoB is empty picks up HCoBa"
      - "If HCoBa is empty picks up HCoBc"
  - variable: "CryFth"
    question: "Ask if DVAge>=16"
    interviewer_instructions:
      - "IF RESPONDENT SAYS BRITAIN, PROBE FOR COUNTRY"
      - "PROMPT AS NECESSARY"
    response_type: "pre-coded"
    pre_codes:
      - code: 4
        text: ".999"
  - variable: "CryFSpc"
    question: "What is the other country?"
    interviewer_instructions:
      - "If CryFth = 997 (respondent’s father was born in another country not listed above)"
      - "IF NOT KNOWN PROMPT FOR THE AREA (E.G., EAST AFRICA, SOUTH AMERICA, ASIA, ETC.)"
  - variable: "CryFFrm"
    question: "PRESS <SPACE BAR> TO ENTER THE CODING FRAME"
    interviewer_instructions:
      - "If CryFth = 997 AND CryFSpc <> empty"
  - variable: "CryMth"
    question: "Ask if DVAge>=16"
    interviewer_instructions:
      - "IF RESPONDENT SAYS BRITAIN, PROBE FOR COUNTRY."
      - "PROMPT AS NECESSARY"
    response_type: "pre-coded"
    pre_codes:
      - code: 4
        text: ".999"
  - variable: "CryMSpc"
    question: "What is the other country?"
    interviewer_instructions:
      - "If CryMth = 997 (respondent’s mother was born in another country not listed above)"
      - "IF NOT KNOWN PROMPT FOR THE AREA (E.G., EAST AFRICA, SOUTH AMERICA, ASIA, ETC.)"
  - variable: "CryMFrm"
    question: "PRESS <SPACE BAR> TO ENTER THE CODING FRAME"
    interviewer_instructions:
      - "If CryMth = 997 AND CryMSpc <> empty"
      - "INDIVIDUAL PROMPT"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "A house or bungalow?"
      - code: 2
        text: "A flat or maisonette?"
      - code: 3
        text: "A room or rooms?"
      - code: 4
        text: "Another type of accommodation?"
  - variable: "HseType"
    question: "Is this house or bungalow …"
    interviewer_instructions:
      - "If respondent lives in a house or a bungalow"
      - "If Accom = 1"
      - "RUNNING PROMPT"
  - variable: "FltTyp"
    question: "Is this flat or maisonette …"
    interviewer_instructions:
      - "If respondent lives in a flat or maisonette"
      - "If Accom = 2"
      - "RUNNING PROMPT"
  - variable: "Ten1"
    routing:
      - "Ask all"
      - "[display HRP Name]"
      - "[Last time this accommodation was… (If RTen1<> empty)]"
    question: "How do you own or rent this accommodation?"
    text_fills:
      - "display HRP Name"
      - "Last time this accommodation was… (If RTen1<> empty)"
    interviewer_instructions:
      - "MAKE SURE ANSWER APPLIES TO HRP"
      - "RUNNING PROMPT"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Own it outright,"
      - code: 2
        text: "Currently pay off a mortgage or loan used to buy the property,"
      - code: 3
        text: "Own it through shared ownership (also known as ‘part-own, part-rent’),"
      - code: 4
        text: "Rent it,"
      - code: 5
        text: "Live here rent-free,"
      - code: 6
        text: "Or squatting?"
  - variable: "HBedrm"
    routing:
      - "Ask all"
    question: "How many bedrooms do you have in this accommodation?"
  - variable: "RentExpAm"
    question: "How much is your usual household rent? Please give this amount before any housing benefit is deducted."
    interviewer_instructions:
      - "If Ten1 = 3,4 - respondent has shared ownership or pays rent"
      - "IF HOUSING BENEFIT IS PAID DIRECTLY TO THE LANDLORD, THIS AMOUNT SHOULD ALSO BE INCLUDED IN THE VALUE PROVIDED HERE"
    response_type: "pre-coded"
    pre_codes:
      - code: 0
        text: "00..99997.00"
  - variable: "RentExpPR"
    question: "How often do you pay this amount?"
    interviewer_instructions:
      - "If Ten1 = 3,4 - respondent has shared ownership or pays rent"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "One week"
      - code: 2
        text: "Two weeks"
      - code: 3
        text: "Three weeks"
      - code: 4
        text: "Four weeks"
      - code: 5
        text: "One month"
      - code: 7
        text: "Two months"
      - code: 13
        text: "Three months"
      - code: 26
        text: "Six months"
      - code: 52
        text: "One year/12 months/52 weeks"
      - code: 97
        text: "Other (Please specify)"
  - variable: "RentExpSP"
    question: "Specify period rent covers"
    interviewer_instructions:
      - "If RentExpPr = 97 (rent period is other)"
  - variable: "LLord"
    routing:
      - "[Last time the landlord was… (If RLLord <> empty)]"
    question: "Ten1 = 4,5 - respondent rents or lives there rent-free"
    text_fills:
      - "Last time the landlord was… (If RLLord <> empty)"
    interviewer_instructions:
      - "If respondent rents or lives there rent-free"
      - "RUNNING PROMPT"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "the local authority / council / Scottish Homes?"
      - code: 2
        text: "a housing association, charitable trust or Local Housing Company?"
      - code: 3
        text: "employer (organisation) of a household member?"
      - code: 4
        text: "another organisation?"
      - code: 5
        text: "relative/friend (before you lived here) of a household member?"
      - code: 6
        text: "employer (individual) of a household member?"
      - code: 7
        text: "another individual private landlord?"
      - code: 1
        text: "furnished,"
      - code: 2
        text: "partly furnished (e.g. curtains and carpets only),"
      - code: 3
        text: "or unfurnished?"
  - variable: "RentHol"
    question: "Do you have a rent holiday?"
    interviewer_instructions:
      - "If LLord=1 or 2 - Respondents rents from LA or HA"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes"
      - code: 2
        text: "No"
  - variable: "RentHoWk"
    question: "For how many weeks a year do you have a rent holiday?"
    interviewer_instructions:
      - "If RentHol = 1 (respondent takes a rent holiday)"
    response_type: "pre-coded"
    pre_codes:
      - code: 0
        text: ".52"
  - variable: "HHown"
    question: "Which of the following best describes how you came to own this property outright? Have you…"
    interviewer_instructions:
      - "If HldStat = 2 AND Ten1 = 1 (respondent lives at a new address ONLY and they own the accommodation outright)"
      - "RUNNING PROMPT"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "bought it for cash,"
      - code: 2
        text: "bought it with a mortgage or loan that has since been paid off,"
      - code: 3
        text: "inherited it or been given all or a share of the property,"
      - code: 4
        text: "or, acquired it in some other way?"
  - variable: "CTAmt"
    routing:
      - "Ask all"
    question: "How much Council Tax do you or your household currently pay?"
    response_type: "pre-coded"
    pre_codes:
      - code: 0
        text: ".5000"
  - variable: "CTInstal"
    question: "Was that the payment for the year, or was it an instalment?"
    interviewer_instructions:
      - "If CTAmt > 0 - respondent has given a council tax amount"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Payment for the year"
      - code: 2
        text: "Instalment"
  - variable: "CTTime"
    question: "How many instalments are there over the whole year?"
    interviewer_instructions:
      - "If CTInstal= Instalment (respondent pays for their council tax in instalments)"
    response_type: "pre-coded"
    pre_codes:
      - code: 0
        text: ".52"
  - variable: "CTRG2"
    routing:
      - "Ask all"
      - "ASK ALL"
    question: "Have you received the Council Tax Rebate grant which has been introduced for households due to rising energy bills?"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes,"
      - code: 2
        text: "No, not eligible for the grant,"
      - code: 3
        text: "No, but expect to receive it in the near future,"
      - code: 4
        text: "Not sure/Don't know"
  - variable: "MethElec"
    routing:
      - "ASK ALL"
    question: "(Added 2210)"
    interviewer_instructions:
      - "Interviewer note: Direct Debit is usually set up with the customer's bank by the supplier. The supplier can alter the amount/timing of debits without the customer taking any action."
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Direct debit (including online direct debit)"
      - code: 2
        text: "Payment on receipt of bill by post, telephone, online or at bank/post office"
      - code: 3
        text: "Standing order"
      - code: 4
        text: "Pre-payment (keycard, slot or token) meters"
      - code: 5
        text: "Included in rent"
      - code: 6
        text: "Frequent cash payment method (i.e. more frequent than once a month)"
      - code: 7
