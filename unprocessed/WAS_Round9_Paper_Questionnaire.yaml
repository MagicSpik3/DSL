      - "RUNNING PROMPT"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Paying into an employer pension scheme,"
      - code: 2
        text: "Paying into a personal pension scheme,"
      - code: 3
        text: "Investing in the stock market by buying stocks or shares,"
