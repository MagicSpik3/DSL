      - code: 8
        text: "Or some other way of saving?"
  - variable: "OTrustN"
    question: "[*] Which of these would you trust for advice about saving for retirement…"
    interviewer_instructions:
      - "If PersProx = 1 AND (DVAge < 40) OR (DVAge >= 4 AND YinAct <> 5) - not a proxy interview, and respondent is less than 40 years of age or over 40 years of age but not retired."
    response_type: "pre-coded"
    pre_codes:
      - code: 1
