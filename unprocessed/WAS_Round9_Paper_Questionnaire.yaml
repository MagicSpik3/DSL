  - variable: "SBIntro"
    routing:
      - "Ask all"
    question: "Now I'm going to ask some questions about any pension arrangements you have, these may be from employment or personal pension arrangements. Please note that here we are excluding the state retirement pension."
  - variable: "SBActNow"
    routing:
      - "Ask all"
    question: "Are you, [your employer (if DVILO3a= InEmp AND Stat = Employee)] or anyone else on your behalf currently making regular contributions to any pension schemes?"
    interviewer_instructions:
      - "IF REQUIRED, PROMPT TO EXCLUDE STATE PENSION"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes"
      - code: 2
        text: "No"
  - variable: "SBPUn"
    routing:
      - "Ask all"
    question: "Have you, an employer or anyone else contributed to any [other (if SBActNow = 1)] pension schemes in the past that you have not yet received any money from?"
    interviewer_instructions:
      - "IF REQUIRED, PROMPT TO EXCLUDE STATE PENSION"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes (trigger Preserved Untouched pensions)"
      - code: 2
        text: "No"
  - variable: "SBPinPNow"
    routing:
      - "Ask all"
    question: "Are you currently receiving any regular pension payments? [Again do not consider State Pension payments in your response (if DVAge >54)]"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes (go to SBPPa & trigger Pensions in payment)"
      - code: 2
        text: "No"
  - variable: "SBPinPPast"
    question: "Have you ever received any money from a pension scheme? [(other than the State Pension) (if PenBen = ‘State Retirement Pension')] This could have been in the form of regular payments or as lump sum."
    interviewer_instructions:
      - "If SBPinPNow = No"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes (trigger Pensions in payment)"
      - code: 2
        text: "No"
  - variable: "SBPPa"
    routing:
      - "Ask all"
      - "[DO NOT INCLUDE PENSIONS ALREADY RECEIVED OR ANY WIDOWS PENSIONS ALREADY RECORDED (if SBPinPNow = 1 OR SBPinPNow = 1)]"
    question: "[Excluding the pensions you are in receipt of, do (if SBPinPNow = 1 OR SBPinPPast = 1); Do (if SBPinPNow = 2 AND SBPinPPast = 2)] you expect to receive a pension from any schemes that someone else has contributed to? This could be from a previous spouse or partner even if they currently live in another household."
    text_fills:
      - "DO NOT INCLUDE PENSIONS ALREADY RECEIVED OR ANY WIDOWS PENSIONS ALREADY RECORDED (if SBPinPNow = 1 OR SBPinPNow = 1)"
    interviewer_instructions:
      - "If (SBActNow) OR SBPUn OR (SBPinPNow OR SBPinPPast) OR SBPPa) = 1 - go to SBOutro"
      - "If (SBActNow) AND SBPUn AND (SBPinPNow OR SBPinPPast) AND SBPPa) = 2 - go to SBOutroNo"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes (trigger Previous Spouse or Partner Pensions)"
      - code: 2
        text: "No"
  - variable: "SBOutro"
    routing:
      - "[- pension plans you or someone on your behalf are currently contributing to (if SBActNow = 1)]"
      - "[- pension plans you have stopped contributing to and haven’t withdrawn money from yet (if SBPUn = 1)]"
      - "[- pensions you are or have received payments from (if SBPinPNow = 1 OR SBPinPPast=1)]"
      - "[- pension entitlements from a previous spouse or partner (if SBPPa= 1)]"
    question: "Thank you, with this information I can tailor the rest of the section to questions about:"
    text_fills:
      - "- pension plans you or someone on your behalf are currently contributing to (if SBActNow = 1)"
      - "- pension plans you have stopped contributing to and haven’t withdrawn money from yet (if SBPUn = 1)"
      - "- pensions you are or have received payments from (if SBPinPNow = 1 OR SBPinPPast=1)"
      - "- pension entitlements from a previous spouse or partner (if SBPPa= 1)"
    interviewer_instructions:
      - "If (SBActNow) OR SBPUn OR (SBPinPNow OR SBPinPPast) OR SBPPa) = 1 (Yes)"
      - "If SBOutro = 1 AND switchboard (SBActNow = 1) go to ActIntro (Active Pensions section)"
      - "If SBOutro = 2 go to SBOutroCheck"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Yes"
      - code: 2
        text: "No"
  - variable: "SBOutroCheck"
    question: "SIGNAL: If SBOutro = 2 (No) - Signal text ‘Please go back and change the information, then change SBOutro to Yes’"
    interviewer_instructions:
      - "If SBOutro = 2 (No)"
      - "INTERVIEWER CHECK WITH THE RESPONDENT THE PREVIOUS ANSWERS AND RECORD THE CORRECT INFORMATION"
    response_type: "pre-coded"
    pre_codes:
      - code: 1
        text: "Cont (interview cannot be continued until SBOutro = 1)"
  - variable: "SBOutroNo"
    question: "Thank you - based on your circumstances there is no need to ask any more pension-related questions."
    interviewer_instructions:
      - "If (SBActNow) AND SBPUn AND (SBPinPNow OR SBPinPPast) AND SBPPa) = 2 (No)"
  - variable: "ActIntro"
    question: "Next I am going to ask you some questions about pension schemes you or someone on your behalf are currently contributing to."
    interviewer_instructions:
      - "If Switchboard (SBActNow = 1)"
  - variable: "ActTyp"
    question: "Thinking about the pensions you or someone on your behalf [are currently contributing to, do you have..."
    interviewer_instructions:
      - "If Switchboard (SBActNow = 1)"
      - "RUNNING PROMPT"
      - "If ActTyp=1, go to ActEPNum"
      - "If ActTyp=2, go to ActPPNum"
      - "If ActTyp=3, go to ActEPNum and ActPPNum"
      - "If ActTyp = employer or both and not employed, signal “Earlier, you said you were not currently in employment; are you sure you are currently contributing to a pension set up by an employer?”"
    response_type: "pre-coded"
    pre_codes:
